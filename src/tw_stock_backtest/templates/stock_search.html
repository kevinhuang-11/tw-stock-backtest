<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/stock.css"><title>個股搜尋</title><nav><a href="/">工作台</a><a href="/watchlist">自選與筆記</a></nav><h1>個股搜尋</h1><form><label>股票代號或名稱<input name="q" maxlength="40" value="{{ query }}"></label><button>搜尋</button></form><p>只讀本機股票名單與資料庫代號，最多顯示 30 筆；輸入四位數代號即可查看無資料個股。</p><section>{% for item in items %}<p><a href="/stocks/{{ item.stock_id }}">{{ item.stock_id }} {{ item.get('name') or '名稱未提供' }}</a> · {{ item.get('industry') or '產業未提供' }}</p>{% else %}<p>沒有符合的本機名單，不會自動下載。</p>{% endfor %}</section></html>
