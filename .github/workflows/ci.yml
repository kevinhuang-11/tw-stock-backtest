name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # 與 pyproject.toml 的 dev 依賴使用同一版本；不同版本的排版結果可能不同。
      - run: python -m pip install ruff==0.17.0
      - name: Check formatting
        run: ruff format --check
      - name: Lint
        run: ruff check --output-format=github
      # 只檢查 pyproject.toml [tool.mypy] files 列出的核心模組；版本與 dev 依賴相同。
      - run: python -m pip install mypy==2.3.1
      - name: Type check
        run: mypy
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Test installed package from a clean directory
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
