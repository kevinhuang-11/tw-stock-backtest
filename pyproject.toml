[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-stock-backtest"
version = "0.1.0"
description = "Taiwan stock screening and backtesting tools"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "Flask>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tw_stock_backtest*"]

[tool.setuptools.package-data]
tw_stock_backtest = ["templates/*.html"]
